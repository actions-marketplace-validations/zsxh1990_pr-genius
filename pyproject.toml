[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-genius"
version = "1.9.1"
description = "PR 评估和建议工具 — 基于历史反模式和成功模式。DSH (Cordis) 插件壳 + Python FastMCP 分析引擎。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zsxh1990" }]
keywords = ["pr", "code-review", "mcp", "dsh-plugin", "deepseek-harness"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
prgenius = "prgenius.cli:main"

[tool.setuptools.packages.find]
where = ["prgenius/src"]

[tool.setuptools.package-data]
prgenius = ["py.typed"]
