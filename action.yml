name: 'PR Genius Advisor'
description: 'Pre-submission PR advisor — risk analysis, contribution strategy checks, and actionable recommendations for open-source PRs'
author: 'zsxh1990'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  title:
    description: 'PR title'
    required: true
  repo:
    description: 'Target repo (org/name)'
    required: true
  body:
    description: 'PR body/description'
    required: false
    default: ''
  star_count:
    description: 'Repo star count'
    required: false
    default: '0'
  apply_labels:
    description: 'Apply pr-genius risk labels to PR'
    required: false
    default: 'false'
  comment_on_high_risk:
    description: 'Deprecated — use comment_mode instead. Post comment on high-risk PRs'
    required: false
    default: 'false'
  comment_mode:
    description: >-
      When to post a full PR Genius analysis as a visible PR comment
      (mirrors pr-agent /review). One of: never, high_risk, always.
      Default '' keeps legacy behavior: equivalent to high_risk only when
      comment_on_high_risk is true, otherwise never.
    required: false
    default: ''
  github_token:
    description: 'GitHub token for label/comment operations'
    required: false
    default: ${{ github.token }}
  pr_number:
    description: 'PR number (required for labels/comments)'
    required: false
    default: ''

outputs:
  tier:
    description: 'Risk tier (low_risk/medium_risk/high_risk)'
    value: ${{ steps.analysis.outputs.tier }}
  result:
    description: 'Full analysis JSON'
    value: ${{ steps.analysis.outputs.result }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install pr-genius
      shell: bash
      run: pip install prgenius-core

    - name: Run PR Genius
      id: analysis
      shell: bash
      env:
        PR_TITLE: ${{ inputs.title }}
        PR_REPO: ${{ inputs.repo }}
        PR_BODY: ${{ inputs.body }}
      run: |
        # Write body to temp file to avoid shell escaping issues
        PR_BODY_FILE=$(mktemp)
        echo "$PR_BODY" > "$PR_BODY_FILE"

        RESULT=$(python3 -m prgenius analyze "$PR_TITLE" \
          --repo "$PR_REPO" \
          --body "$(cat "$PR_BODY_FILE")" \
          --format json 2>&1)

        rm -f "$PR_BODY_FILE"

        # Validate JSON output
        if ! echo "$RESULT" | python3 -m json.tool >/dev/null 2>&1; then
          echo "::error::PR Genius did not return valid JSON"
          echo "$RESULT"
          exit 1
        fi

        TIER=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('tier','unknown'))")

        echo "tier=$TIER" >> $GITHUB_OUTPUT
        echo "result<<EOF" >> $GITHUB_OUTPUT
        echo "$RESULT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

        # Write GitHub Step Summary
        echo "$RESULT" | python3 -c "
        import json, sys
        from prgenius.status import format_step_summary_analyze
        data = json.load(sys.stdin)
        print(format_step_summary_analyze(data))
        " >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

    - name: Apply risk labels
      if: inputs.apply_labels == 'true' && inputs.pr_number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        TIER: ${{ steps.analysis.outputs.tier }}
        REPO: ${{ inputs.repo }}
      run: |
        # Remove old pr-genius labels
        for label in "pr-genius:low-risk" "pr-genius:medium-risk" "pr-genius:high-risk"; do
          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$label" 2>/dev/null || true
        done
        # Add current tier label
        LABEL="pr-genius:${TIER//_/-}"
        gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$LABEL" 2>/dev/null || \
          echo "::warning::Could not apply label $LABEL (label may not exist in repo)"

    - name: Comment analysis on PR
      if: inputs.pr_number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REPO: ${{ inputs.repo }}
        RESULT: ${{ steps.analysis.outputs.result }}
        TIER: ${{ steps.analysis.outputs.tier }}
        COMMENT_ON_HIGH_RISK: ${{ inputs.comment_on_high_risk }}
        COMMENT_MODE: ${{ inputs.comment_mode }}
      run: |
        # Decide whether to comment based on comment_mode; '' keeps legacy
        # behavior (comment_on_high_risk == 'true' acts as high_risk).
        MODE="$COMMENT_MODE"
        if [ -z "$MODE" ]; then
          if [ "$COMMENT_ON_HIGH_RISK" = "true" ]; then
            MODE="high_risk"
          else
            MODE="never"
          fi
        fi
        if [ "$MODE" = "never" ]; then
          exit 0
        fi
        if [ "$MODE" = "high_risk" ] && [ "$TIER" != "high_risk" ]; then
          exit 0
        fi
        echo "$RESULT" | python3 "${{ github.action_path }}/.github/actions/pr-genius-check/post_comment.py" \
          --repo "$REPO" --pr-number "$PR_NUMBER" --token "$GH_TOKEN" || \
          echo "::warning::PR Genius comment step failed (advisory only)"
